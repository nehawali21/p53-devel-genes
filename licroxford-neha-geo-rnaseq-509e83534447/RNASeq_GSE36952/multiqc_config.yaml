# Notes
# do not use tabs in this file
#

# force plots to be interactive even if sample number threshold exceeded - this may cause the browser to crash
plots_force_interactive: true

# change the default limit on the number of samples before flat plots replace interactive plots
plots_flat_numseries: 100 # Try to use only interactive javascript graphs
num_datasets_plot_limit: 50 # If interactive, don't plot on load if > this number of datasets
max_table_rows: 500 # Swap tables for a beeswarm plot above this

# add the theoretical GC content for the reference genome
fastqc_config:
  fastqc_theoretical_gc: "hg38_genome"

# customize General Statistics table
table_columns_visible:
    FastQC (raw): false
    FastQC (trimmed): false

custom_data:

  rRNA_QC:
    file_format: 'tsv'
    section_name: 'RSeQC rRNA'
    description: 'The results table generated from RSeQC %rRNA output.'
    plot_type: 'table'
    pconfig:
      id: 'rRNA_QC'
      title: 'RSeQC %rRNA Table'
      namespace: 'rRNA_QC'
    headers:
      'Lanes':
        format: '{:,.0f}'
      'Aligner':
        categories: True
      'Total Count':
        format: '{:,.0f}'
        scale: "RdYlGn"
      'non-rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn"
      'non-rRNA pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
      'rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'rRNA pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"

  st_rRNA_QC:
    file format: 'tsv'
    section_name: 'Samtools rRNA'
    description: 'The results table generated from Samtools %rRNA output.'
    plot type: 'table'
    pconfig:
      id: 'st_rRNA_QC'
      title: 'Samtools %rRNA Table'
      namespace: 'st_rRNA_QC'
    headers:
      'Lanes':
        format: '{:,.0f}'
      'Aligner':
        categories: True
      'Total Count':
        format: '{:,.0f}'
        scale: "RdYlGn"
      'non-rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn"
      'all rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'mt rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'mt rRNA 1 Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'mt rRNA 2 Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'pseudo rRNA Count':
        format: '{:,.0f}'
        scale: "RdYlGn-rev"
      'non-rRNA pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn"
      'all rRNA pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"
      'rRNA pct':
        format: '{:,.3f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"
      'mt rRNA pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"
      'mt rRNA 1 pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"
      'mt rRNA 2 pct':
        format: '{:,.1f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"
      'pseudo rRNA pct':
        format: '{:,.3f}'
        suffix: '%'
        min: 0
        scale: "RdYlGn-rev"

sp:
  st_rRNA_QC:
    fn: "st_rRNA_QC_mqc*"
  rRNA_QC:
    fn: "rRNA_QC_mqc*"

# custom content
custom_content:
  order:
    - rRNA_QC
    - st_rRNA_QC

module_order:
    - custom_content:

# add separate sections for featureCounts on STAR
    - featureCounts:
        name: 'featureCounts (STAR)'
        anchor: 'featureCounts_STAR'
        info: 'This section shows featureCounts from STAR alignment'
        path_filters:
            - './featureCounts/*STAR_gene.featureCounts.txt.summary'

# add separate sections for RnaSeqMetrics on STAR
    - picard:
        name: 'RnaSeqMetrics (STAR)'
        anchor: 'RnaSeqMetrics_STAR'
        info: 'This section shows RnaSeqMetrics from STAR alignment'
        path_filters:
            - './rnaseqmetrics_star/*STAR_output.RNA_Metrics'

# add separate sections for MultipleMetrics on STAR
    - picard:
        name: 'MultipleMetrics (STAR)'
        anchor: 'MultipleMetrics_STAR'
        info: 'This section shows picard MultipleMetrics from STAR alignment'
        path_filters:
            - './multiplemetrics_star/*_STAR.*metrics.txt'

    - STAR:
        name: 'STAR'
        anchor: 'STAR'
        info: 'This section shows log data from STAR alignment'
        path_filters:
            - './star/*.out'

# add separate outputs for FastQC on raw and trimmed fastqs
    - fastqc:
        name: 'FastQC (raw)'
        anchor: 'fastqc_raw'
        info: 'This section of the report shows FastQC results before adapter trimming.'
        path_filters_exclude:
            - './fastqc/*_trimmed*fastqc.zip'

    - fastqc:
        name: 'FastQC (trimmed)'
        anchor: 'fastqc_trimmed'
        info: 'This section of the report shows FastQC results after adapter trimming.'
        path_filters:
            - './fastqc/*_trimmed*fastqc.zip'

    - fastqc:
        name: 'FastQC'
        anchor: 'fastqc'
        info: 'This section of the report shows FastQC results before adapter trimming.'
        path_filters:
            - './fastqc/*fastqc.zip'


